<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIRLINK | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eef8ff,
                #dff2ff
            );
            color: #172b4d;
        }

        .login-page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 360px;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 15px 45px rgba(40, 100, 150, 0.15);
            border: 1px solid #dceaf7;
            text-align: center;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;
            background: #e6f2ff;
            font-size: 27px;
        }

        .login-card h2 {
            margin: 0 0 8px;
            font-size: 25px;
            color: #172b4d;
        }

        .login-subtitle {
            margin: 0 0 28px;
            font-size: 13px;
            color: #7890aa;
        }

        .form-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 11px;
            font-weight: 700;
            color: #5f7895;
            text-transform: uppercase;
        }

        .form-group input {
            box-sizing: border-box;
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid #cddff0;
            border-radius: 10px;

            background: #f7fbff;
            color: #172b4d;

            outline: none;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #2388ff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(35, 136, 255, 0.10);
        }

        .login-btn {
            width: 100%;
            height: 48px;

            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #1687d9,
                #16b8a6
            );

            color: white;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(22, 135, 217, 0.22);

            transition: 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(22, 135, 217, 0.30);
        }

        .error {
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 9px;

            background: #fff1f1;
            border: 1px solid #ffd1d1;

            color: #d64545;
            font-size: 12px;
        }

        .signup-link {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e5edf5;

            font-size: 12px;
            color: #7b8fa6;
        }

        .signup-link a {
            color: #1687d9;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .secure-note {
            margin-top: 18px;
            font-size: 10px;
            color: #8aa0b7;
        }

        @media (max-width: 480px) {
            .login-card {
                width: 100%;
                max-width: 360px;
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            ✈ AIR<span>LINK</span>
        </div>
    </div>


    <!-- LOGIN -->
    <div class="login-page">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h2>Admin Login</h2>

            <p class="login-subtitle">
                Access the AIRLINK administration dashboard
            </p>


            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

<!-- IMPORTANT: submit to /login -->
<form method="POST" action="{{ url_for('login_page') }}">

    <input
        type="hidden"
        name="next"
        value="{{ next_page|default('home') }}"
    >

    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Dashboard →
                </button>

            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Sign Up
                </a>

            </div>


            <div class="secure-note">
                🔒 Your login information is securely protected
            </div>

        </div>

    </div>

</body>
</html>
